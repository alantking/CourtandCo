<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court & Co Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF7F2;
      color: #2C352E;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    .pastel-card {
      background: #FFFFFF;
      border: 1px solid rgba(226, 219, 206, 0.6);
      box-shadow: 0 10px 25px -5px rgba(112, 130, 56, 0.05);
    }
    .purplish-pink-btn {
      background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #c7d2fe 100%);
      color: #4c1d95;
      border: 1px solid rgba(216, 180, 254, 0.6);
    }
    .purplish-pink-btn:hover {
      background: linear-gradient(135deg, #f472b6 0%, #c084fc 50%, #818cf8 100%);
      color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">

  <div class="max-w-md mx-auto">
    
    <!-- Header with Scale Logo Beside Title -->
    <header class="flex items-center justify-center gap-3 mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-200 via-purple-200 to-indigo-200 shadow-inner text-xl border border-white shrink-0">
        ⚖️
      </div>
      <h1 class="serif-title text-3xl font-bold tracking-tight text-[#2C352E]">Court & Co</h1>
    </header>

    <!-- Note Input Form -->
    <div class="pastel-card rounded-2xl p-5 mb-6">
      <form id="note-form" class="space-y-3">
        <textarea id="note-input" rows="3" placeholder="What's on your mind? (Tea, Popcorn, Books, Music, Lunch...)" required class="w-full p-3 text-sm rounded-xl border border-[#E2DBCE] bg-[#FAF7F2]/50 focus:outline-none focus:ring-2 focus:ring-purple-300 resize-none"></textarea>
        
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <select id="category-select" class="text-xs font-medium py-2 px-3 rounded-lg border border-[#E2DBCE] bg-[#FAF7F2] text-[#2C352E] focus:outline-none">
            <option value="Tea 🍵">Tea 🍵</option>
            <option value="Popcorn 🍿">Popcorn 🍿</option>
            <option value="Books 📖">Books 📖</option>
            <option value="Music 🎵">Music 🎵</option>
            <option value="Lunch 🌭">Lunch 🌭</option>
            <option value="Libra ⚖️">Libra ⚖️</option>
            <option value="Dogs 🐶">Dogs 🐶</option>
          </select>

          <!-- Purplish Pink Add Note Button -->
          <button type="submit" class="purplish-pink-btn text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all active:scale-95">
            Add Note ✨
          </button>
        </div>
      </form>
    </div>

    <!-- Filter Bar -->
    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none text-xs">
      <button onclick="filterNotes('All')" class="filter-btn active-filter whitespace-nowrap px-3.5 py-1.5 rounded-full font-semibold purplish-pink-btn transition">All</button>
      <button onclick="filterNotes('Tea 🍵')" class="filter-btn whitespace-nowrap px-3 py-1.5 rounded-full font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 transition">Tea 🍵</button>
      <button onclick="filterNotes('Popcorn 🍿')" class="filter-btn whitespace-nowrap px-3 py-1.5 rounded-full font-medium bg-amber-50 text-amber-800 border border-amber-200 transition">Popcorn 🍿</button>
      <button onclick="filterNotes('Books 📖')" class="filter-btn whitespace-nowrap px-3 py-1.5 rounded-full font-medium bg-purple-50 text-purple-800 border border-purple-200 transition">Books 📖</button>
      <button onclick="filterNotes('Music 🎵')" class="filter-btn whitespace-nowrap px-3 py-1.5 rounded-full font-medium bg-blue-50 text-blue-800 border border-blue-200 transition">Music 🎵</button>
      <button onclick="filterNotes('Lunch 🌭')" class="filter-btn whitespace-nowrap px-3 py-1.5 rounded-full font-medium bg-pink-50 text-pink-800 border border-pink-200 transition">Lunch 🌭</button>
    </div>

    <!-- Notes List Container -->
    <div id="notes-container" class="space-y-3">
      <!-- Dynamic notes loaded here -->
    </div>

  </div>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔑 REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAeJ_b5nYWDwbMscjz6gqDpIOG6ZHn7x9Y",
  authDomain: "notes-fa406.firebaseapp.com",
  databaseURL: "https://notes-fa406-default-rtdb.firebaseio.com",
  projectId: "notes-fa406",
  storageBucket: "notes-fa406.firebasestorage.app",
  messagingSenderId: "352813884789",
  appId: "1:352813884789:web:a68e940a1dad3f79f81f3c",
  measurementId: "G-SSBJGGTD7M"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const notesRef = ref(db, 'court_notes');

    const noteForm = document.getElementById('note-form');
    const noteInput = document.getElementById('note-input');
    const categorySelect = document.getElementById('category-select');
    const notesContainer = document.getElementById('notes-container');

    let allNotesData = {};
    let currentFilter = 'All';

    // Badge styling mapping
    const categoryStyles = {
      'Tea 🍵': 'bg-emerald-50 text-emerald-800 border-emerald-200',
      'Popcorn 🍿': 'bg-amber-50 text-amber-800 border-amber-200',
      'Books 📖': 'bg-purple-50 text-purple-800 border-purple-200',
      'Music 🎵': 'bg-blue-50 text-blue-800 border-blue-200',
      'Lunch 🌭': 'bg-pink-50 text-pink-800 border-pink-200',
      'Libra ⚖️': 'bg-indigo-50 text-indigo-800 border-indigo-200',
      'Dogs 🐶': 'bg-orange-50 text-orange-800 border-orange-200'
    };

    // Add Note
    noteForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = noteInput.value.trim();
      const category = categorySelect.value;
      if (text) {
        push(notesRef, {
          text,
          category,
          timestamp: Date.now()
        });
        noteInput.value = '';
      }
    });

    // Listen to Firebase Realtime Database
    onValue(notesRef, (snapshot) => {
      const data = snapshot.val();
      allNotesData = data || {};
      renderNotes();
    });

    // Render Function
    window.renderNotes = () => {
      notesContainer.innerHTML = '';
      const entries = Object.entries(allNotesData);

      if (entries.length === 0) {
        notesContainer.innerHTML = `
          <div class="text-center py-12 pastel-card rounded-2xl">
            <p class="text-sm text-stone-400">No notes yet. Add your first note above! ✨</p>
          </div>
        `;
        return;
      }

      // Sort newest first
      entries.sort((a, b) => b[1].timestamp - a[1].timestamp);

      let visibleCount = 0;
      entries.forEach(([id, note]) => {
        if (currentFilter !== 'All' && note.category !== currentFilter) return;
        visibleCount++;

        const badgeClass = categoryStyles[note.category] || 'bg-stone-100 text-stone-800 border-stone-200';
        
        const card = document.createElement('div');
        card.className = 'pastel-card rounded-2xl p-4 flex flex-col justify-between transition-all hover:shadow-md';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${badgeClass}">${note.category}</span>
              <span class="text-[10px] text-stone-400">${new Date(note.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            <p class="text-sm text-[#2C352E] whitespace-pre-wrap mb-4">${escapeHtml(note.text)}</p>
          </div>
          <div class="flex items-center justify-end gap-2 pt-2 border-t border-stone-100">
            <button onclick="editNote('${id}', '${escapeJs(note.text)}')" class="text-xs text-stone-500 hover:text-purple-700 font-medium px-2 py-1 rounded">Edit</button>
            <button onclick="deleteNote('${id}')" class="text-xs text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded">Delete</button>
          </div>
        `;
        notesContainer.appendChild(card);
      });

      if (visibleCount === 0) {
        notesContainer.innerHTML = `
          <div class="text-center py-8 pastel-card rounded-2xl">
            <p class="text-sm text-stone-400">No notes found in ${currentFilter}</p>
          </div>
        `;
      }
    };

    // Filter Helper
    window.filterNotes = (category) => {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('purplish-pink-btn', 'font-semibold');
        btn.classList.add('font-medium');
        if (btn.textContent.includes(category) || (category === 'All' && btn.textContent === 'All')) {
          btn.classList.add('purplish-pink-btn', 'font-semibold');
        }
      });
      renderNotes();
    };

    // Global Actions
    window.deleteNote = (id) => {
      remove(ref(db, `court_notes/${id}`));
    };

    window.editNote = (id, currentText) => {
      const newText = prompt('Edit note:', currentText);
      if (newText !== null && newText.trim() !== '') {
        update(ref(db, `court_notes/${id}`), { text: newText.trim() });
      }
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeJs(str) {
      return str.replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
